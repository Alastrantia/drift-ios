name: Build & Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: cloud.groll.drift
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS-26" in rt for d in ds]
          pref = ["iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro", "iPhone Air"]
          for name in pref:
              for d in devs:
                  if d["name"] == name: print(d["udid"]); sys.exit()
          print(next(d["udid"] for d in devs if d["name"].startswith("iPhone")))
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Drift.xcodeproj -scheme Drift -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/Drift.app

      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          xcodebuild -project Drift.xcodeproj -scheme Drift -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 \
            | grep -E "error:|BUILD" || true
          mkdir -p out/Payload
          cp -R build-device/Build/Products/Release-iphoneos/Drift.app out/Payload/
          (cd out && zip -qry Drift-unsigned.ipa Payload && rm -rf Payload)

      - name: Boot simulator
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiBars 3 --dataNetwork wifi
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Drift.app
          # Warm-up launch so the first screenshot isn't caught mid-launch.
          xcrun simctl launch "$UDID" "$BUNDLE_ID"; sleep 12; xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

      - name: Capture screenshots
        run: |
          mkdir -p out/screens
          for s in listen detail morph nowplaying breathe insights search settings; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -DemoScreen "$s"
            sleep 7
            xcrun simctl io "$UDID" screenshot "out/screens/$s.png"
          done

      - name: Record tour video
        run: |
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force out/tour.mp4 &
          REC=$!
          sleep 2
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -DemoScreen tour
          sleep 50
          kill -INT $REC; wait $REC || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-showcase
          path: |
            out/
            build.log
          if-no-files-found: warn

      - name: Shut down simulator
        if: always()
        run: |
          pkill -f "simctl io" || true
          xcrun simctl shutdown all || true
          killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
